<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SDUFE 图书馆签到系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .btn {
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn-checkin {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        
        .btn-leave {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .btn-checkout {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .status {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
            display: block;
        }
        
        .status.success {
            background: #e8f5e9;
            color: #388e3c;
            display: block;
        }
        
        .status.error {
            background: #ffebee;
            color: #d32f2f;
            display: block;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .debug {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
            margin-top: 20px;
            display: none;
        }
        
        .debug.show {
            display: block;
        }
        
        .info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }
        
        .info strong {
            color: #333;
        }
        
        .hidden {
            display: none !important;
        }
        
        #debugToggle {
            margin-top: 10px;
            background: none;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 5px 10px;
            font-size: 12px;
            color: #666;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- 主应用界面（默认隐藏，密码验证后显示） -->
    <div class="container" id="appContainer">
        <h1>📚 图书馆签到</h1>
        <div class="subtitle">山东财经大学 · 远程签到系统</div>
        
        <div class="status hidden" id="status"></div>
        
        <div class="btn-group">
            <button class="btn btn-checkin" id="btnCheckin" onclick="handleAction('in')">
                ✅ 签到入馆
            </button>
            <button class="btn btn-leave" id="btnLeave" onclick="handleAction('leave')">
                🚶 临时离馆
            </button>
            <button class="btn btn-checkout" id="btnCheckout" onclick="handleAction('out')">
                🚪 签离出馆
            </button>
        </div>
        
        <div class="info">
            <strong>⚠️ 使用说明：</strong><br>
            1. 确保手机已连接校园网（WLAN: SDUFE）<br>
            2. 建议用手机默认浏览器打开（Chrome/Safari）<br>
            3. 点击按钮后，系统会自动获取时间戳并跳转签到<br>
            4. 如果失败，尝试关闭移动数据后重试
        </div>
        
        <button id="debugToggle" onclick="toggleDebug()">🔧 显示调试信息</button>
        
        <div class="debug" id="debugInfo"></div>
    </div>

    <script>
    // ===== 密码验证模块（混淆版） =====
    (function() {
        'use strict';
        
        // 🔑 密钥数组（10个数字，对应10位密码）
        const SECRET_KEY = [7, 3, 9, 1, 5, 8, 2, 4, 6, 7];
        
        // 🔒 加密后的密码（十六进制，这是 "zhtzht8888" 的加密结果）
        const ENCRYPTED_PASSWORD = "816b7d7b6d7c3a3c3e3f";
        
        // 🧮 密码验证函数
        function verifyPassword(userInput) {
            if (userInput.length !== SECRET_KEY.length) return false;
            
            const inputChars = userInput.split('').map(c => c.charCodeAt(0));
            const encryptedInput = inputChars.map((charCode, index) => {
                return charCode + SECRET_KEY[index];
            });
            
            const hexString = encryptedInput.map(num => {
                return num.toString(16).padStart(2, '0');
            }).join('');
            
            return hexString === ENCRYPTED_PASSWORD;
        }
        
        // 🔐 启动验证
        function initAuth() {
            const savedAuth = localStorage.getItem('library_auth');
            if (savedAuth === 'true') {
                initApp();
                return;
            }
            
            const userInput = prompt('🔐 请输入访问密码：');
            if (userInput === null) {
                document.body.innerHTML = '<h2 style="text-align:center;margin-top:50px;color:white;">访问已取消</h2>';
                return;
            }
            
            if (!verifyPassword(userInput)) {
                alert('❌ 密码错误！');
                document.body.innerHTML = '<h2 style="text-align:center;margin-top:50px;color:white;">访问被拒绝</h2>';
                return;
            }
            
            localStorage.setItem('library_auth', 'true');
            initApp();
        }
        
        initAuth();
    })();

    // ===== 主应用逻辑 =====
    function initApp() {
        // 显示主界面
        document.getElementById('appContainer').classList.remove('hidden');
    }
    
    // 显示状态消息
    function showStatus(message, type) {
        const statusEl = document.getElementById('status');
        statusEl.innerHTML = message;
        statusEl.className = 'status ' + type;
        statusEl.classList.remove('hidden');
    }
    
    // 隐藏状态消息
    function hideStatus() {
        const statusEl = document.getElementById('status');
        statusEl.classList.add('hidden');
    }
    
    // 设置按钮状态
    function setButtonsDisabled(disabled) {
        document.getElementById('btnCheckin').disabled = disabled;
        document.getElementById('btnLeave').disabled = disabled;
        document.getElementById('btnCheckout').disabled = disabled;
    }
    
    // 显示调试信息
    function showDebug(info) {
        const debugEl = document.getElementById('debugInfo');
        debugEl.innerHTML = info;
    }
    
    // 切换调试信息显示
    function toggleDebug() {
        const debugEl = document.getElementById('debugInfo');
        const toggleBtn = document.getElementById('debugToggle');
        if (debugEl.classList.contains('show')) {
            debugEl.classList.remove('show');
            toggleBtn.textContent = '🔧 显示调试信息';
        } else {
            debugEl.classList.add('show');
            toggleBtn.textContent = '🔧 隐藏调试信息';
        }
    }
    
    // 处理签到/离馆/签离操作
    async function handleAction(action) {
        hideStatus();
        setButtonsDisabled(true);
        
        // 确定类型参数
        const typeMap = {
            'in': 1,      // 签到入馆
            'leave': 2,    // 临时离馆
            'out': 3        // 签离出馆
        };
        
        const type = typeMap[action];
        const actionName = {
            'in': '签到入馆',
            'leave': '临时离馆',
            'out': '签离出馆'
        }[action];
        
        showStatus('⏳ 正在获取时间戳...', 'loading');
        
        // 调试信息
        let debugInfo = '<strong>🔧 调试信息：</strong><br>';
        debugInfo += '📡 API地址：<a href="https://libst.sdufe.edu.cn/api.php/v3qrtime" target="_blank">libst.sdufe.edu.cn/api.php/v3qrtime</a><br>';
        debugInfo += '📡 请求方式：GET<br>';
        debugInfo += '📡 超时时间：10秒<br><br>';
        
        showDebug(debugInfo);
        
        try {
            // 调用图书馆API获取时间戳
            const apiUrl = 'https://libst.sdufe.edu.cn/api.php/v3qrtime';
            
            // 添加时间戳防止缓存
            const cacheBuster = '?_=' + Date.now();
            
            const response = await fetch(apiUrl + cacheBuster, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json, text/plain, */*',
                },
                // 防止缓存
                cache: 'no-cache',
                // 设置超时
                signal: AbortSignal.timeout(10000)
            });
            
            debugInfo += '📥 API响应状态：' + response.status + ' ' + response.statusText + '<br>';
            debugInfo += '📥 响应头：<br>';
            for (const [key, value] of response.headers.entries()) {
                debugInfo += '   ' + key + ': ' + value + '<br>';
            }
            debugInfo += '<br>';
            
            if (!response.ok) {
                throw new Error('API请求失败，状态码：' + response.status + ' ' + response.statusText);
            }
            
            const responseText = await response.text();
            debugInfo += '📥 API响应内容：<br><pre style="background:#eee;padding:5px;border-radius:5px;overflow-x:auto;">' + responseText + '</pre><br>';
            
            // 尝试解析JSON
            let data;
            let timestamp = '';
            try {
                data = JSON.parse(responseText);
                debugInfo += '📥 JSON解析成功：<br><pre style="background:#eee;padding:5px;border-radius:5px;overflow-x:auto;">' + JSON.stringify(data, null, 2) + '</pre><br>';
                
                // 尝试多种可能的字段名
                if (data.time) {
                    timestamp = data.time;
                } else if (data.t) {
                    timestamp = data.t;
                } else if (data.timestamp) {
                    timestamp = data.timestamp;
                } else if (data.data && data.data.time) {
                    timestamp = data.data.time;
                } else {
                    // 如果找不到，尝试把整个响应作为时间戳
                    timestamp = responseText.trim();
                }
            } catch (e) {
                // 如果不是JSON，假设是纯文本时间戳
                debugInfo += '📥 非JSON响应，尝试作为纯文本处理<br>';
                timestamp = responseText.trim();
            }
            
            debugInfo += '⏰ 获取到的时间戳：' + timestamp + '<br><br>';
            showDebug(debugInfo);
            
            if (!timestamp || timestamp.length < 6) {
                throw new Error('获取时间戳失败，API返回异常：' + responseText);
            }
            
            showStatus('✅ 时间戳获取成功，正在跳转...', 'success');
            
            // 构造签到URL
            const checkinUrl = `http://www.skalibrary.net/wx/scancheck?school=sdufe&type=${type}&t=${timestamp}`;
            
            debugInfo += '🔗 签到URL：<a href="' + checkinUrl + '" target="_blank">' + checkinUrl + '</a><br>';
            debugInfo += '🔗 即将跳转...<br>';
            showDebug(debugInfo);
            
            // 延迟1秒后跳转，让用户看到成功提示
            setTimeout(() => {
                window.location.href = checkinUrl;
            }, 1000);
            
        } catch (error) {
            console.error('操作失败：', error);
            debugInfo += '❌ 错误：' + error.message + '<br>';
            if (error.name === 'AbortError' || error.name === 'TimeoutError') {
                debugInfo += '❌ 请求超时，可能原因：<br>';
                debugInfo += '   1. 手机未连接校园网（WLAN: SDUFE）<br>';
                debugInfo += '   2. 校园网信号弱或断开<br>';
                debugInfo += '   3. 微信内置浏览器限制了网络请求<br>';
                debugInfo += '   4. API服务器暂时不可用<br><br>';
                debugInfo += '💡 建议：<br>';
                debugInfo += '   ✅ 用手机默认浏览器（Chrome/Safari）打开此页面<br>';
                debugInfo += '   ✅ 关闭手机移动数据，强制走WLAN<br>';
                debugInfo += '   ✅ 确认已连接 SDUFE 的 WLAN<br>';
            }
            showDebug(debugInfo);
            showStatus('❌ ' + error.message + '<br><br>📱 <strong>请确保已连接校园网（SDUFE）后重试</strong><br><br>💡 建议用手机默认浏览器打开此页面', 'error');
            setButtonsDisabled(false);
        }
    }
    
    // 页面加载
    document.addEventListener('DOMContentLoaded', function() {
        // 密码验证模块会自动调用 initApp()
        // 如果已经通过验证，则直接显示主界面
        const savedAuth = localStorage.getItem('library_auth');
        if (savedAuth === 'true') {
            initApp();
        }
    });
    </script>
</body>
</html>
