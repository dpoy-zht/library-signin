<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDUFE 图书馆签到系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .btn {
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn-checkin {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        
        .btn-leave {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .btn-checkout {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .status {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
            display: block;
        }
        
        .status.success {
            background: #e8f5e9;
            color: #388e3c;
            display: block;
        }
        
        .status.error {
            background: #ffebee;
            color: #d32f2f;
            display: block;
        }
        
        .info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }
        
        .info strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 图书馆签到</h1>
        <div class="subtitle">山东财经大学 · 远程签到系统</div>
        
        <div class="status" id="status"></div>
        
        <div class="btn-group">
            <button class="btn btn-checkin" id="btnCheckin" onclick="handleAction('in')">
                ✅ 签到入馆
            </button>
            <button class="btn btn-leave" id="btnLeave" onclick="handleAction('leave')">
                🚶 临时离馆
            </button>
            <button class="btn btn-checkout" id="btnCheckout" onclick="handleAction('out')">
                🚪 签离出馆
            </button>
        </div>
        
        <div class="info">
            <strong>⚠️ 使用说明：</strong><br>
            1. 确保手机已连接校园网（WLAN: SDUFE）<br>
            2. 点击按钮后，系统会自动获取时间戳并跳转签到<br>
            3. 签到成功后会跳转到图书馆页面确认
        </div>
    </div>

    <script>
    // 显示状态消息
    function showStatus(message, type) {
        const statusEl = document.getElementById('status');
        statusEl.innerHTML = message;
        statusEl.className = 'status ' + type;
    }
    
    // 隐藏状态消息
    function hideStatus() {
        const statusEl = document.getElementById('status');
        statusEl.className = 'status';
    }
    
    // 设置按钮状态
    function setButtonsDisabled(disabled) {
        document.getElementById('btnCheckin').disabled = disabled;
        document.getElementById('btnLeave').disabled = disabled;
        document.getElementById('btnCheckout').disabled = disabled;
    }
    
    // 处理签到/离馆/签离操作
    async function handleAction(action) {
        hideStatus();
        setButtonsDisabled(true);
        
        // 确定类型参数
        const typeMap = {
            'in': 1,      // 签到入馆
            'leave': 2,    // 临时离馆
            'out': 3        // 签离出馆
        };
        
        const type = typeMap[action];
        const actionName = {
            'in': '签到入馆',
            'leave': '临时离馆',
            'out': '签离出馆'
        }[action];
        
        showStatus('⏳ 正在获取时间戳...', 'loading');
        
        try {
            // 调用图书馆API获取时间戳
            const apiUrl = 'https://libst.sdufe.edu.cn/api.php/v3qrtime';
            
            const response = await fetch(apiUrl, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                },
                // 防止缓存
                cache: 'no-cache'
            });
            
            if (!response.ok) {
                throw new Error('API请求失败，状态码：' + response.status);
            }
            
            const data = await response.json();
            
            // 假设API返回格式为 { data: "51526269564" }
            let timestamp = '';
            if (data.data) {
                timestamp = data.data;
            } else if (data.time) {
                timestamp = data.time;
            } else if (typeof data === 'string') {
                timestamp = data;
            } else {
                throw new Error('无法解析API返回的时间戳');
            }
            
            if (!timestamp || timestamp.length < 6) {
                throw new Error('获取时间戳失败，API返回异常');
            }
            
            showStatus('✅ 时间戳获取成功，正在跳转...', 'success');
            
            // 构造签到URL
            const checkinUrl = `http://www.skalibrary.net/wx/scancheck?school=sdufe&type=${type}&t=${timestamp}`;
            
            // 延迟1秒后跳转，让用户看到成功提示
            setTimeout(() => {
                window.location.href = checkinUrl;
            }, 1000);
            
        } catch (error) {
            console.error('操作失败：', error);
            showStatus('❌ ' + error.message + '<br><br>📱 <strong>请确保已连接校园网（SDUFE）后重试</strong>', 'error');
            setButtonsDisabled(false);
        }
    }
    </script>
</body>
</html>
