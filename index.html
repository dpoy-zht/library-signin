<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SDUFE图书馆签到</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 18px 30px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .btn-checkin {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-tempout {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-checkout {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 14px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }

        .info-box strong {
            color: #333;
        }

        .api-status {
            background: #e7f3ff;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 12px;
            color: #004085;
            display: none;
        }

        .api-status.success {
            display: block;
            background: #d4edda;
            color: #155724;
        }

        .api-status.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 图书馆签到</h1>
        <p class="subtitle">山东财经大学图书馆自助签到系统</p>

        <div class="btn-group">
            <button class="btn btn-checkin" onclick="doAction('1')">
                ✅ 签到入馆
            </button>
            <button class="btn btn-tempout" onclick="doAction('2')">
                ⏰ 临时离馆
            </button>
            <button class="btn btn-checkout" onclick="doAction('3')">
                🚪 签离出馆
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">正在获取时间戳...</p>
        </div>

        <div class="status" id="status"></div>

        <div class="api-status" id="apiStatus"></div>

        <div class="info-box">
            <strong>使用说明：</strong><br>
            • 确保在校园网环境下使用<br>
            • 点击按钮将直接获取时间戳<br>
            • 自动跳转至图书馆系统<br>
            • 暂离时间上限：100分钟（中午除外）
        </div>
    </div>

    <script>
        // 🔒 密码保护配置
        const ACCESS_PASSWORD = "sdufe2026"; // 修改为你想设置的密码
        
        // 检查密码
        function checkPassword() {
            const savedAuth = localStorage.getItem('library_auth');
            if (savedAuth === 'authenticated') {
                return true;
            }
            
            const input = prompt("🔒 请输入访问密码：\n（首次使用请联系管理员获取密码）");
            if (input === ACCESS_PASSWORD) {
                localStorage.setItem('library_auth', 'authenticated');
                alert("✅ 密码正确！\n（已记住你的授权，下次无需重新输入）");
                return true;
            } else {
                alert("❌ 密码错误！");
                return false;
            }
        }
        
        // 页面加载时检查密码
        if (!checkPassword()) {
            document.body.innerHTML = `
                <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                <div style="background: white; padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
            <h1 style="color: #333;">🚫 访问被拒绝</h1>
                        <p style="color: #666; margin-top: 20px;">密码错误或无访问权限</p>
                        <p style="color: #999; font-size: 12px; margin-top: 20px;">如有疑问，请联系管理员</p>
                    </div>
                </div>
            `;
            throw new Error("Access denied");
        }
        
        const LIBRARY_API = 'https://libst.sdufe.edu.cn/api.php/v3qrtime';
        const LIBRARY_BASE_URL = 'http://www.skalibrary.net/wx/scancheck';

        // 页面加载时测试API连接
        window.addEventListener('load', function() {
            testAPI();
        });

        function testAPI() {
            const apiStatus = document.getElementById('apiStatus');
            apiStatus.className = 'api-status';
            apiStatus.innerHTML = '正在检测API连接...';

            fetch(LIBRARY_API, { 
                method: 'GET',
                mode: 'cors',
                cache: 'no-cache'
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                return response.json();
            })
            .then(data => {
                if (data.status === 1) {
                    apiStatus.className = 'api-status success';
                    apiStatus.innerHTML = '✅ API连接正常<br>当前时间戳: ' + data.data;
                } else {
                    throw new Error(data.msg || 'API返回错误');
                }
            })
            .catch(error => {
                apiStatus.className = 'api-status error';
                apiStatus.innerHTML = '❌ API连接失败<br>请确保手机已连接校园网<br>错误: ' + error.message;
            });
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }

        function showLoading(show) {
            const loadingDiv = document.getElementById('loading');
            if (show) {
                loadingDiv.classList.add('active');
            } else {
                loadingDiv.classList.remove('active');
            }
        }

        function doAction(type) {
            showLoading(true);
            showStatus('', '');

            // 禁用所有按钮
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => btn.disabled = true);

            // 直接调用图书馆API获取时间戳
            fetch(LIBRARY_API, {
                method: 'GET',
                mode: 'cors',
                cache: 'no-cache'
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                return response.json();
            })
            .then(data => {
                if (data.status === 1) {
                    const timestamp = data.data;
                    
                    // 构建完整URL
                    const fullUrl = LIBRARY_BASE_URL + '?school=sdufe&type=' + type + '&t=' + timestamp;
                    
                    showLoading(false);
                    showStatus('时间戳获取成功，正在跳转...', 'info');

                    // 延迟一下让用户看到提示
                    setTimeout(() => {
                        // 直接在微信中打开链接
                        window.location.href = fullUrl;
                    }, 500);
                } else {
                    throw new Error(data.msg || '获取时间戳失败');
                }
            })
            .catch(error => {
                showLoading(false);
                showStatus('错误：' + error.message, 'error');
                
                // 重新启用按钮
                buttons.forEach(btn => btn.disabled = false);
            });
        }
    </script>
</body>
</html>
